<!DOCTYPE html>
<html>
<head>
    <title>ModChecker By Kakashki — Key</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', 'Gotham', sans-serif;
            text-align: center;
            padding-top: 120px;
            margin: 0;
        }
        h1 {
            color: #00aaff;
            font-size: 28px;
            margin-bottom: 30px;
        }
        .key {
            font-size: 32px;
            color: #00ff64;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            background: #252525;
            border: 2px solid #00aaff;
            border-radius: 12px;
            padding: 25px 50px;
            display: inline-block;
            min-width: 300px;
        }
        .copy-btn {
            background: #00aaff;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
            transition: 0.2s;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .copy-btn:hover { background: #0088cc; }
        .copy-btn.copied { background: #00cc44; }
    </style>
</head>
<body>
    <h1>🔑 ModChecker By Kakashki</h1>

    <div class="key" id="keyDisplay">Loading...</div>

    <button class="copy-btn" id="copyBtn" onclick="copyKey()">📋 Copy Key</button>

    <script>
        // ===== НАСТРОЙКИ =====
        // SECRET должен совпадать со скриптом Lua!
        const SECRET = "KakashkiSecret2025_v1";
        const KEY_PREFIX = "key_";
        const KEY_LENGTH = 8;
        const MAX_INDEX = 1000;
        const STORAGE_KEY = "modchecker_current_key";

        // ===== 32-битная хеш-функция (XOR + rotate) =====
        function rotl32(x, n) {
            return ((x << n) | (x >>> (32 - n))) >>> 0;
        }

        function simpleHash(str, seed) {
            let h = seed >>> 0;
            for (let i = 0; i < str.length; i++) {
                const byte = str.charCodeAt(i) & 0xFF;
                h = (h ^ byte) >>> 0;
                h = rotl32(h, 5);
                h = (h + 0x9E3779B9) >>> 0;
            }
            h = (h ^ (h >>> 16)) >>> 0;
            h = rotl32(h, 13);
            h = (h ^ (h >>> 7)) >>> 0;
            h = rotl32(h, 17);
            h = (h ^ (h >>> 5)) >>> 0;
            return h >>> 0;
        }

        // ===== Генерация ключа по индексу =====
        function generateKey(index) {
            const input = KEY_PREFIX + index + "_" + SECRET;
            const h1 = simpleHash(input, 0x811C9DC5);
            const h2 = simpleHash(input + "_salt", 0x12345678);
            const h3 = simpleHash(h1.toString() + h2.toString(), 0xDEADBEEF);

            let combined = (h1 ^ rotl32(h2, 7)) >>> 0;
            combined = (combined ^ (h3 >>> 3)) >>> 0;
            combined = combined >>> 0;

            let hex = combined.toString(16).toUpperCase().padStart(8, "0");
            return hex.substring(0, KEY_LENGTH).toLowerCase();
        }

        // ===== Случайный ключ =====
        function getRandomKey() {
            const index = Math.floor(Math.random() * MAX_INDEX) + 1;
            return generateKey(index);
        }

        // ===== Логика: берём из localStorage или генерируем новый =====
        let currentKey;

        function loadOrGenerateKey() {
            let saved = null;
            try {
                saved = localStorage.getItem(STORAGE_KEY);
            } catch (e) {
                saved = null;
            }

            // Если сохранённый ключ есть и он корректной длины — используем его
            if (saved && saved.length === KEY_LENGTH) {
                currentKey = saved;
            } else {
                // Иначе генерируем новый и сохраняем
                currentKey = getRandomKey();
                try {
                    localStorage.setItem(STORAGE_KEY, currentKey);
                } catch (e) {}
            }
        }

        // ===== Инициализация =====
        loadOrGenerateKey();
        document.getElementById("keyDisplay").textContent = currentKey;

        function copyKey() {
            navigator.clipboard.writeText(currentKey).then(function() {
                const btn = document.getElementById("copyBtn");
                btn.textContent = "✅ Copied!";
                btn.classList.add("copied");
                setTimeout(function() {
                    btn.textContent = "📋 Copy Key";
                    btn.classList.remove("copied");
                }, 2000);
            });
        }
    </script>
</body>
</html>

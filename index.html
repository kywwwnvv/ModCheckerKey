<!DOCTYPE html>
<html>
<head>
    <title>ModChecker By Kakashki — Key</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', 'Gotham', sans-serif;
            text-align: center;
            padding-top: 120px;
            margin: 0;
        }
        h1 {
            color: #00aaff;
            font-size: 28px;
            margin-bottom: 30px;
        }
        .key {
            font-size: 32px;
            color: #00ff64;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            background: #252525;
            border: 2px solid #00aaff;
            border-radius: 12px;
            padding: 25px 50px;
            display: inline-block;
            min-width: 300px;
        }
        .copy-btn {
            background: #00aaff;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
            transition: 0.2s;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .copy-btn:hover {
            background: #0088cc;
        }
        .copy-btn.copied {
            background: #00cc44;
        }
    </style>
</head>
<body>
    <h1>🔑 ModChecker By Kakashki</h1>

    <div class="key" id="keyDisplay">Loading...</div>

    <button class="copy-btn" id="copyBtn" onclick="copyKey()">📋 Copy Key</button>

    <script>
        const keys = [
            "KAKASHKI-2026",
            "MODCHECKER-VIP",
            "TEST-KEY-123",
            "KAKASHKI-PRO",
            "NIGHT-MODE-KEY"
        ];

        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        document.getElementById("keyDisplay").textContent = randomKey;

        function copyKey() {
            navigator.clipboard.writeText(randomKey).then(function() {
                const btn = document.getElementById("copyBtn");
                btn.textContent = "✅ Copied!";
                btn.classList.add("copied");
                setTimeout(function() {
                    btn.textContent = "📋 Copy Key";
                    btn.classList.remove("copied");
                }, 2000);
            });
        }
    </script>
</body>
</html>
